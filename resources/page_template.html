<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$tabtitle$</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #3498db;
      --bg: #ffffff;
      --bg-alt: #f8f9fa;
      --border: #dee2e6;
      --text: #212529;
      --text-muted: #6c757d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Header */
    header {
      border-bottom: 3px solid var(--accent);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    h2 {
      color: var(--primary);
      font-size: 1.4rem;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }

    h3 {
      color: var(--primary);
      font-size: 1.1rem;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      margin-bottom: 0.75rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    code {
      background: var(--bg-alt);
      padding: 0.15em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    th {
      background: var(--primary);
      color: white;
      text-align: left;
      padding: 0.5rem 0.75rem;
      font-weight: 600;
    }

    td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    tr:nth-child(even) td {
      background: var(--bg-alt);
    }

    tr:hover td {
      background: #e8f4fd;
    }

    /* Lists */
    ul,
    ol {
      margin-bottom: 0.75rem;
      padding-left: 1.5rem;
    }

    li {
      margin-bottom: 0.25rem;
    }

    /* Downloads box */
    .downloads {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      padding: 1rem 1.5rem;
      margin: 2rem 0;
    }

    .downloads h2 {
      border-bottom: none;
      margin-top: 0;
      padding-bottom: 0;
    }

    .downloads ul {
      list-style: none;
      padding-left: 0;
    }

    .downloads li {
      padding: 0.3rem 0;
    }

    .downloads li::before {
      content: "📄 ";
    }

    /* Strong within first paragraph block (profile info) */
    strong {
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <h1>$title$</h1>
  </header>
  <main>
    $body$
  </main>
</body>

</html>
